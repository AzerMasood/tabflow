<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabFlow & Progress Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {

  </script>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      background-color: #121212;
      color: #f3f4f6;
      font-family: 'Inter', system-ui, sans-serif;
    }
    ::-webkit-scrollbar {

    }
    ::-webkit-scrollbar-track {

    ::-webkit-scrollbar-thumb {

</head>
<body class="bg-[#121212] text-gray-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
  <div id="root"></div>

  <!-- React 18 + Babel Standalone for zero-build browser execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // WEBAUDIO REALISTIC GUITAR PLUCK & ACOUSTIC DRUM SYNTHESIZER
    // =========================================================================
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.noiseBuffer = null;
      }

      init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          if (!this.noiseBuffer && this.ctx) {
            const length = this.ctx.sampleRate * 2;
            const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < length; i++) {
              data[i] = Math.random() * 2 - 1;
            }
            this.noiseBuffer = buffer;
          }
        } catch (err) {
          console.error('AudioEngine init error:', err);
        }
      }

      // Karplus-Strong physical string pluck synthesis
      playGuitarNote(freq, duration = 2.0) {
        try {
          this.init();
          if (!this.ctx || !freq || freq <= 0) return;

          const sampleRate = this.ctx.sampleRate;
          const bufferSize = Math.max(2, Math.round(sampleRate / freq));
          const noiseBuffer = this.ctx.createBuffer(1, bufferSize, sampleRate);
          const output = noiseBuffer.getChannelData(0);

          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }

          const whiteNoise = this.ctx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = Math.min(freq * 4, 8000);

          const delay = this.ctx.createDelay(1.0);
          delay.delayTime.value = 1 / freq;

          const feedback = this.ctx.createGain();
          feedback.gain.value = 0.985;

          const masterGain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          masterGain.gain.setValueAtTime(0.6, now);
          masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          whiteNoise.connect(filter);
          filter.connect(delay);
          delay.connect(feedback);
          feedback.connect(delay);
          delay.connect(masterGain);
          masterGain.connect(this.ctx.destination);

          whiteNoise.start(now);
          whiteNoise.stop(now + 0.05);
        } catch (err) {
          console.error('Guitar note synthesis error:', err);
        }
      }

      // Synthesized acoustic kick, snare, and hi-hat hits
      playDrum(type) {
        try {
          this.init();
          if (!this.ctx || !this.noiseBuffer) return;
          const t = this.ctx.currentTime;

          if (type === 'kick') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(130, t);
            osc.frequency.exponentialRampToValueAtTime(30, t + 0.12);
            gain.gain.setValueAtTime(1.0, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.15);
          } else if (type === 'snare') {
            const noise = this.ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;
            const noiseFilter = this.ctx.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.value = 1000;
            const noiseGain = this.ctx.createGain();
            noiseGain.gain.setValueAtTime(0.7, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(this.ctx.destination);

            const osc = this.ctx.createOscillator();
            const oscGain = this.ctx.createGain();
            osc.frequency.setValueAtTime(180, t);
            oscGain.gain.setValueAtTime(0.5, t);
            oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.connect(oscGain);
            oscGain.connect(this.ctx.destination);

            osc.start(t);
            noise.start(t);
            osc.stop(t + 0.15);
            noise.stop(t + 0.15);
          } else if (type === 'hihat') {
            const noise = this.ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 7000;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start(t);
            noise.stop(t + 0.05);
          }
        } catch (err) {
          console.error('Drum synthesis error:', err);
        }
      }
    }

    const audioSynthesizer = new AudioEngine();

    // =========================================================================
    // CONSTANTS & MUSIC THEORY DATA
    // =========================================================================
    const NOTE_FREQS = {
      'E2': 82.41, 'F2': 87.31, 'F#2': 92.50, 'G2': 98.00, 'G#2': 103.83, 'A2': 110.00, 'A#2': 116.54, 'B2': 123.47,
      'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'G3': 196.00,
      'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94, 'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13,
      'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
      'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'E5': 659.25
    };

    const KANBAN_COLUMNS = [
      { id: 'want', title: 'Want to Learn', color: 'from-amber-500/20 to-yellow-600/10 border-amber-500/30' },
      { id: 'progress', title: 'In Progress', color: 'from-blue-500/20 to-indigo-600/10 border-blue-500/30' },
      { id: 'polishing', title: 'Polishing', color: 'from-purple-500/20 to-pink-600/10 border-purple-500/30' },
      { id: 'mastered', title: 'Mastered', color: 'from-emerald-500/20 to-teal-600/10 border-emerald-500/30' }
    ];

    const GUITAR_STRINGS = [
      { name: 'E', startFreq: NOTE_FREQS['E4'], notes: ['E','F','F#','G','G#','A','A#','B','C','C#','D','D#'] },
      { name: 'B', startFreq: NOTE_FREQS['B3'], notes: ['B','C','C#','D','D#','E','F','F#','G','G#','A','A#'] },
      { name: 'G', startFreq: NOTE_FREQS['G3'], notes: ['G','G#','A','A#','B','C','C#','D','D#','E','F','F#'] },
      { name: 'D', startFreq: NOTE_FREQS['D3'], notes: ['D','D#','E','F','F#','G','G#','A','A#','B','C','C#'] },
      { name: 'A', startFreq: NOTE_FREQS['A2'], notes: ['A','A#','B','C','C#','D','D#','E','F','F#','G','G#'] },
      { name: 'E', startFreq: NOTE_FREQS['E2'], notes: ['E','F','F#','G','G#','A','A#','B','C','C#','D','D#'] }
    ];

    const CHROMATIC_SCALE = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    const INTERVAL_LABELS = {
      0: 'R',
      1: 'b2',
      2: '2',
      3: 'b3',
      4: '3',
      5: '4',
      6: 'b5',
      7: '5',
      8: '#5',
      9: '6',
      10: 'b7',
      11: '7'
    };

    const SCALES_MAP = {
      'Major (Ionian)': [0, 2, 4, 5, 7, 9, 11],
      'Minor (Aeolian)': [0, 2, 3, 5, 7, 8, 10],
      'Pentatonic Minor': [0, 3, 5, 7, 10],
      'Blues': [0, 3, 5, 6, 7, 10],
      'Dorian': [0, 2, 3, 5, 7, 9, 10]
    };

    const FRET_NUMBERS = Array.from({ length: 25 }, (_, i) => i); // Frets 0 through 24
    const SINGLE_DOT_FRETS = new Set([3, 5, 7, 9, 15, 17, 19, 21]);
    const DOUBLE_DOT_FRETS = new Set([12, 24]);

    function getNoteAtFret(stringIndex, fret) {
      const baseStr = GUITAR_STRINGS[stringIndex];
      const baseNoteIndex = CHROMATIC_SCALE.indexOf(baseStr.name);
      const noteName = CHROMATIC_SCALE[(baseNoteIndex + fret) % 12];
      const freq = baseStr.startFreq * Math.pow(2, fret / 12);
      return { noteName, freq };
    }

    // Warm tones for Root (R), Major 3rd (3), and 5th (5); cool tones for other intervals
    function getIntervalToneClass(intervalLabel, isActive = true) {
      if (!isActive) {
        return 'bg-[#181820] text-gray-600 border border-gray-800/70 hover:text-gray-300';
      }
      // Warm trio: red / orange / lemon-yellow (clearly separated hues)
      if (intervalLabel === 'R') {
        return 'bg-red-500 text-white border border-red-300 font-bold';
      }
      if (intervalLabel === '3') {
        return 'bg-orange-500 text-gray-950 border border-orange-300 font-bold';
      }
      if (intervalLabel === '5') {
        return 'bg-yellow-300 text-gray-950 border border-yellow-100 font-bold';
      }
      // Cool tones: each interval gets its own hue (cyan, teal, blue, indigo, green, violet, magenta)
      if (intervalLabel === '2' || intervalLabel === 'b2') {
        return 'bg-cyan-500 text-gray-950 border border-cyan-200 font-semibold';
      }
      if (intervalLabel === 'b3') {
        return 'bg-teal-600 text-white border border-teal-300 font-semibold';
      }
      if (intervalLabel === '4') {
        return 'bg-blue-600 text-white border border-blue-300 font-semibold';
      }
      if (intervalLabel === 'b5' || intervalLabel === '#5') {
        return 'bg-indigo-700 text-indigo-100 border border-indigo-300 font-semibold';
      }
      if (intervalLabel === '6') {
        return 'bg-emerald-500 text-gray-950 border border-emerald-200 font-semibold';
      }
      if (intervalLabel === 'b7') {
        return 'bg-violet-600 text-white border border-violet-300 font-semibold';
      }
      if (intervalLabel === '7') {
        return 'bg-fuchsia-600 text-white border border-fuchsia-300 font-semibold';
      }
      return 'bg-slate-600 text-white border border-slate-300 font-semibold';
    }

    function extractYouTubeId(url) {
      if (!url || typeof url !== 'string') return null;
      const trimmed = url.trim();
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/,
        /youtu\.be\/([A-Za-z0-9_-]{11})/
      ];
      for (const re of patterns) {
        const match = trimmed.match(re);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    function getMediaInfo(url) {
      const ytId = extractYouTubeId(url);
      if (ytId) {
        return {
          kind: 'youtube',
          id: ytId,
          thumbnailUrl: `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`,
          embedUrl: `https://www.youtube.com/embed/${ytId}?autoplay=1`
        };
      }
      if (url && /\.(mp3|wav|ogg|m4a|webm)(\?.*)?$/i.test(url.trim())) {
        return {
          kind: 'audio',
          thumbnailUrl: 'https://placehold.co/640x360/1e1e26/f59e0b?text=Audio+Track',
          audioUrl: url.trim()
        };
      }
      if (url && url.trim()) {
        return {
          kind: 'link',
          thumbnailUrl: 'https://placehold.co/640x360/1e1e26/f59e0b?text=Embedded+Song+Link',
          watchUrl: url.trim()
        };
      }
      return null;
    }

    const STORAGE_KEY = 'tabflow_songs_local_v1';

    function loadInitialSongs() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (err) {
        console.error('Failed to read saved songs:', err);
      }
      return [
        {
          id: 'sample-1',
          artist: 'Pink Floyd',
          title: 'Wish You Were Here',
          sourceUrl: 'https://www.youtube.com/watch?v=IXdNnw99-Ic',
          column: 'progress',
          snapshots: [],
          attachedPreset: { bpm: 63, chord: 'G Major' },
          createdAt: new Date().toISOString()
        }
      ];
    }

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    function App() {
      const [songs, setSongs] = useState(loadInitialSongs);
      const [statusBanner, setStatusBanner] = useState('');

      // Link import modal state
      const [importUrl, setImportUrl] = useState('');
      const [manualTitle, setManualTitle] = useState('');
      const [manualArtist, setManualArtist] = useState('');
      const [showAddModal, setShowAddModal] = useState(false);

      // External tab split drawer view state
      const [activeTabDrawer, setActiveTabDrawer] = useState(null); // { songId, platform }
      const [snapshotUrlInput, setSnapshotUrlInput] = useState('');

      // Expanded song focus view state
      const [expandedSongId, setExpandedSongId] = useState(null);
      const [showExpandedDetails, setShowExpandedDetails] = useState(false);
      const [expandedPlayerActive, setExpandedPlayerActive] = useState(false);

      // Inline card player state (stores active songId playing inline on card)
      const [inlinePlayingSongId, setInlinePlayingSongId] = useState(null);

      // Scale & Custom Chord builder state for expanded focus view
      const [scaleRoot, setScaleRoot] = useState('G');
      const [selectedScaleName, setSelectedScaleName] = useState('Major (Ionian)');
      const [customChordSemitones, setCustomChordSemitones] = useState([]); // user-picked semitone offsets from scaleRoot

      // Drum Machine & Fretboard State (used inside expanded song focus view)
      const [bpm, setBpm] = useState(110);
      const [isPlayingMetronome, setIsPlayingMetronome] = useState(false);
      const [currentBeat, setCurrentBeat] = useState(0);
      const [drumPattern, setDrumPattern] = useState('rock'); // 'rock' | 'straight' | 'click'
      const timerRef = useRef(null);

      // Persist songs locally
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(songs));
        } catch (err) {
          console.error('Failed to save songs:', err);
        }
      }, [songs]);

      const showNotice = (msg) => {
        setStatusBanner(msg);
        setTimeout(() => {
          setStatusBanner((prev) => (prev === msg ? '' : prev));
        }, 2800);
      };

      // --- DRUM MACHINE LOOP ---
      useEffect(() => {
        if (isPlayingMetronome) {
          const intervalMs = (60 / Math.max(40, Math.min(220, bpm))) * 1000;
          timerRef.current = setInterval(() => {
            setCurrentBeat((prev) => {
              const nextBeat = (prev + 1) % 4;
              if (drumPattern === 'rock') {
                audioSynthesizer.playDrum('hihat');
                if (nextBeat === 0 || nextBeat === 2) audioSynthesizer.playDrum('kick');
                if (nextBeat === 1 || nextBeat === 3) audioSynthesizer.playDrum('snare');
              } else if (drumPattern === 'straight') {
                audioSynthesizer.playDrum('hihat');
                if (nextBeat === 0) audioSynthesizer.playDrum('kick');
                if (nextBeat === 2) audioSynthesizer.playDrum('snare');
              } else {
                audioSynthesizer.playDrum(nextBeat === 0 ? 'snare' : 'hihat');
              }
              return nextBeat;
            });
          }, intervalMs);
        } else {
          clearInterval(timerRef.current);
          setCurrentBeat(0);
        }
        return () => clearInterval(timerRef.current);
      }, [isPlayingMetronome, bpm, drumPattern]);

      // --- LINK PARSER ---
      const parseUrl = (url) => {
        let artist = '';
        let title = '';
        const cleanUrl = decodeURIComponent(url || '').replace(/https?:\/\/(www\.)?/, '');

        if (cleanUrl.includes('youtube.com') || cleanUrl.includes('youtu.be')) {
          const parts = cleanUrl.split('/');
          const lastPart = parts[parts.length - 1] || '';
          if (lastPart.includes('-')) {
            const splitDash = lastPart.split('?')[0].split('-');
            artist = splitDash[0].replace(/_/g, ' ');
            title = splitDash.slice(1).join(' ').replace(/_/g, ' ');
          }
        }

        if (!title && (url || '').includes('-')) {
          const rawSplit = url.split('-');
          artist = rawSplit[0].trim();
          title = rawSplit.slice(1).join('-').trim();
        }

        return {
          artist: artist ? artist.charAt(0).toUpperCase() + artist.slice(1) : 'Unknown Artist',
          title: title ? title.charAt(0).toUpperCase() + title.slice(1) : 'New Song'
        };
      };

      const handleAddSong = (e) => {
        e.preventDefault();
        let finalArtist = manualArtist.trim();
        let finalTitle = manualTitle.trim();

        if (importUrl && (!finalArtist || !finalTitle)) {
          const parsed = parseUrl(importUrl);
          if (!finalArtist) finalArtist = parsed.artist;
          if (!finalTitle) finalTitle = parsed.title;
        }

        if (!finalTitle) finalTitle = 'Untitled Song';
        if (!finalArtist) finalArtist = 'Unknown Artist';

        const newSong = {
          id: 'song-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
          artist: finalArtist,
          title: finalTitle,
          sourceUrl: importUrl.trim(),
          column: 'want',
          snapshots: [],
          attachedPreset: { bpm, chord: `${scaleRoot} ${selectedScaleName}` },
          createdAt: new Date().toISOString()
        };

        setSongs((prev) => [newSong, ...prev]);
        setImportUrl('');
        setManualArtist('');
        setManualTitle('');
        setShowAddModal(false);
        showNotice(`Added "${finalTitle}" to Want to Learn`);
      };

      const updateSongColumn = (songId, newCol) => {
        setSongs((prev) => prev.map((s) => (s.id === songId ? { ...s, column: newCol } : s)));
      };

      const deleteSong = (songId) => {
        setSongs((prev) => prev.filter((s) => s.id !== songId));
        if (activeTabDrawer?.songId === songId) {
          setActiveTabDrawer(null);
        }
        if (expandedSongId === songId) {
          setExpandedSongId(null);
        }
        if (inlinePlayingSongId === songId) {
          setInlinePlayingSongId(null);
        }
      };

      const openExpandedSong = (song) => {
        setExpandedSongId(song.id);
        setShowExpandedDetails(false);
        setExpandedPlayerActive(false);
        setCustomChordSemitones([]);

        // Derive scale root and scale type automatically from song preset or song info
        const presetText = `${song.attachedPreset?.chord || ''} ${song.title || ''} ${song.artist || ''}`;
        const matchedRoot = CHROMATIC_SCALE.find((note) =>
          new RegExp(`(^|\\b)${note.replace('#', '\\#')}(\\b|\\s|major|minor|m\\b)`, 'i').test(presetText)
        );
        if (matchedRoot) {
          setScaleRoot(matchedRoot);
        }
        if (/minor|aeolian|m\b/i.test(presetText)) {
          setSelectedScaleName('Minor (Aeolian)');
        } else if (/pentatonic/i.test(presetText)) {
          setSelectedScaleName('Pentatonic Minor');
        } else if (/blues/i.test(presetText)) {
          setSelectedScaleName('Blues');
        } else if (/dorian/i.test(presetText)) {
          setSelectedScaleName('Dorian');
        } else {
          setSelectedScaleName('Major (Ionian)');
        }

        if (song.attachedPreset?.bpm) {
          setBpm(Number(song.attachedPreset.bpm) || 110);
        }
      };

      const addSnapshotToSong = (songId) => {
        const cleanSnap = snapshotUrlInput.trim();
        if (!cleanSnap) return;
        setSongs((prev) =>
          prev.map((s) =>
            s.id === songId ? { ...s, snapshots: [...(s.snapshots || []), cleanSnap] } : s
          )
        );
        setSnapshotUrlInput('');
        showNotice('Snapshot saved to song');
      };

      // Shrink pasted screenshots so they fit comfortably in localStorage
      const imageFileToDataUrl = (file) =>
        new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('read failed'));
          reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error('decode failed'));
            img.onload = () => {
              const maxW = 1400;
              const scale = Math.min(1, maxW / img.width);
              const canvas = document.createElement('canvas');
              canvas.width = Math.round(img.width * scale);
              canvas.height = Math.round(img.height * scale);
              const c = canvas.getContext('2d');
              c.fillStyle = '#ffffff';
              c.fillRect(0, 0, canvas.width, canvas.height);
              c.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', 0.85));
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });

      const removeSnapshot = (songId, index) => {
        setSongs((prev) =>
          prev.map((s) =>
            s.id === songId
              ? { ...s, snapshots: (s.snapshots || []).filter((_, i) => i !== index) }
              : s
          )
        );
        showNotice('Tab image removed');
      };

      const addSnapshotData = (songId, dataUrl) => {
        setSongs((prev) =>
          prev.map((s) =>
            s.id === songId ? { ...s, snapshots: [...(s.snapshots || []), dataUrl] } : s
          )
        );
      };

      const handleTabPaste = async (e, songId) => {
        const items = Array.from(e.clipboardData?.items || []);
        const imgItem = items.find((it) => it.type && it.type.startsWith('image/'));
        if (imgItem) {
          e.preventDefault();
          const file = imgItem.getAsFile();
          if (!file) return;
          try {
            const dataUrl = await imageFileToDataUrl(file);
            addSnapshotData(songId, dataUrl);
            showNotice('Tab image pasted from clipboard');
          } catch (err) {
            showNotice('Could not read pasted image');
          }
        }
        // Plain text (e.g. an image URL) falls through to the input as normal
      };

      const pasteFromClipboardButton = async (songId) => {
        try {
          if (navigator.clipboard && navigator.clipboard.read) {
            const clipItems = await navigator.clipboard.read();
            for (const item of clipItems) {
              const imgType = item.types.find((t) => t.startsWith('image/'));
              if (imgType) {
                const blob = await item.getType(imgType);
                const dataUrl = await imageFileToDataUrl(blob);
                addSnapshotData(songId, dataUrl);
                showNotice('Tab image pasted from clipboard');
                return;
              }
              if (item.types.includes('text/plain')) {
                const blob = await item.getType('text/plain');
                const text = (await blob.text()).trim();
                if (text) {
                  setSnapshotUrlInput(text);
                  showNotice('Pasted link — press Add Tab Image');
                  return;
                }
              }
            }
            showNotice('Clipboard is empty');
          } else {
            showNotice('Click the box and press Ctrl+V instead');
          }
        } catch (err) {
          showNotice('Clipboard blocked — click the box and press Ctrl+V');
        }
      };

      const getSongsterrUrl = (artist, title) => {
        const pattern = encodeURIComponent(`${artist || ''} ${title || ''}`.trim());
        return `https://www.songsterr.com/a/wa/search?pattern=${pattern}`;
      };

      const getUltimateGuitarUrl = (artist, title) => {
        const value = encodeURIComponent(`${artist || ''} ${title || ''}`.trim());
        return `https://www.ultimate-guitar.com/search.php?search_type=title&value=${value}`;
      };

      const drawerSong = activeTabDrawer
        ? songs.find((s) => s.id === activeTabDrawer.songId) || null
        : null;

      const expandedSong = expandedSongId
        ? songs.find((s) => s.id === expandedSongId) || null
        : null;

      const expandedMedia = expandedSong ? getMediaInfo(expandedSong.sourceUrl) : null;

      const scaleRootIdx = CHROMATIC_SCALE.indexOf(scaleRoot);
      const activeScaleOffsets = SCALES_MAP[selectedScaleName] || [0, 2, 4, 5, 7, 9, 11];
      const activeScaleNotes = activeScaleOffsets.map((offset) => ({
        offset,
        note: CHROMATIC_SCALE[(scaleRootIdx + offset) % 12],
        label: INTERVAL_LABELS[offset] || `${offset}`
      }));

      // Interval type classification for chord builder
      const getIntervalType = (offset) => {
        if (offset === 0) return 'Root';
        if (offset === 3 || offset === 4) return '3rd (Quality)';
        if (offset === 7 || offset === 6 || offset === 8) return '5th (Harmonic)';
        if (offset === 10 || offset === 11) return '7th (Extension)';
        if (offset === 1 || offset === 2 || offset === 5 || offset === 9) return 'Tension / Color';
        return 'Interval';
      };

      // Compute possible alternative chord names outside the current key using the same selected notes
      const getAlternativeChordNames = (semitoneOffsets, rootIdx) => {
        if (!semitoneOffsets || semitoneOffsets.length < 2) return [];
        const selectedPitchClasses = new Set(
          semitoneOffsets.map((off) => (rootIdx + off) % 12)
        );
        const currentKeyChordName = `${CHROMATIC_SCALE[rootIdx]} custom`;
        const formulas = [
          { suffix: '', intervals: [0, 4, 7] },
          { suffix: 'm', intervals: [0, 3, 7] },
          { suffix: '5', intervals: [0, 7] },
          { suffix: '7', intervals: [0, 4, 7, 10] },
          { suffix: 'maj7', intervals: [0, 4, 7, 11] },
          { suffix: 'm7', intervals: [0, 3, 7, 10] },
          { suffix: 'sus2', intervals: [0, 2, 7] },
          { suffix: 'sus4', intervals: [0, 5, 7] },
          { suffix: 'dim', intervals: [0, 3, 6] },
          { suffix: 'aug', intervals: [0, 4, 8] },
          { suffix: '6', intervals: [0, 4, 7, 9] },
          { suffix: 'm6', intervals: [0, 3, 7, 9] }
        ];

        const alternatives = [];
        for (let candIdx = 0; candIdx < 12; candIdx++) {
          const candRoot = CHROMATIC_SCALE[candIdx];
          for (const formula of formulas) {
            const formulaPitches = formula.intervals.map((iv) => (candIdx + iv) % 12);
            const matchesAllSelected = [...selectedPitchClasses].every((p) =>
              formulaPitches.includes(p)
            );
            const coversFormula = formulaPitches.every((p) => selectedPitchClasses.has(p));
            if (matchesAllSelected && coversFormula) {
              const name = `${candRoot}${formula.suffix}`;
              if (name !== currentKeyChordName && !alternatives.includes(name)) {
                alternatives.push(name);
              }
            }
          }
        }
        return alternatives.slice(0, 8);
      };

      const pickedChordIntervals = customChordSemitones.map((offset) => {
        const note = CHROMATIC_SCALE[(scaleRootIdx + offset) % 12];
        const intervalName = INTERVAL_LABELS[offset] || `${offset}st`;
        const intervalType = getIntervalType(offset);
        return { offset, note, intervalName, intervalType };
      });

      const alternativeChordNames = getAlternativeChordNames(customChordSemitones, scaleRootIdx);

      const toggleCustomChordTone = (offset, freq = null) => {
        if (freq) {
          audioSynthesizer.playGuitarNote(freq);
        } else {
          const noteName = CHROMATIC_SCALE[(scaleRootIdx + offset) % 12];
          const rootFreq = NOTE_FREQS[`${noteName}3`] || NOTE_FREQS[`${noteName}4`] || 220;
          audioSynthesizer.playGuitarNote(rootFreq);
        }
        setCustomChordSemitones((prev) =>
          prev.includes(offset) ? prev.filter((item) => item !== offset) : [...prev, offset].sort((a, b) => a - b)
        );

                            {/* Attached Modular Tool Presets */}

                                onClick={() =>

                                    songId: song.id,
                                    platform: 'ultimate-guitar',

                                className="flex items-center justify-center gap-1.5 bg-[#2B2317] hover:bg-[#382D1E] text-amber-400 border border-amber-600/30 text-xs py-1.5 rounded-lg transition-colors font-medium"
                              >

                              </button>

                            {/* Column Shift Controls */}

                              onClick={(e) => e.stopPropagation()}
                              className="flex items-center justify-between pt-2 border-t border-gray-800 text-xs"
                            >
                              <button
                                type="button"
                                disabled={col.id === 'want'}
                                onClick={() => {
                                  const currentIndex = KANBAN_COLUMNS.findIndex(
                                    (c) => c.id === col.id
                                  );
                                  if (currentIndex > 0) {
                                    updateSongColumn(
                                      song.id,
                                      KANBAN_COLUMNS[currentIndex - 1].id
                                    );
                                  }
                                }}
                                className="disabled:opacity-20 text-gray-400 hover:text-gray-200 flex items-center gap-1 disabled:cursor-not-allowed"
                              >
                                ← Move
                              </button>
                              <button
                                type="button"
                                disabled={col.id === 'mastered'}
                                onClick={() => {
                                  const currentIndex = KANBAN_COLUMNS.findIndex(
                                    (c) => c.id === col.id
                                  );
                                  if (currentIndex < KANBAN_COLUMNS.length - 1) {
                                    updateSongColumn(
                                      song.id,
                                      KANBAN_COLUMNS[currentIndex + 1].id
                                    );
                                  }
                                }}
                                className="disabled:opacity-20 text-amber-400 hover:text-amber-300 flex items-center gap-1 disabled:cursor-not-allowed font-medium"
                              >
                                Advance →
                              </button>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              );
            })}
          </div>

      </div>

                  type="button"
                  onClick={() => addSnapshotToSong(expandedSong.id)}
                  className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-gray-950 hover:bg-amber-400 shrink-0"
                >
                  Add Tab Image
                </button>
              </div>
              {statusBanner && (
                <div className="mb-3 text-[11px] font-mono text-amber-300 bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-lg inline-block">
                  {statusBanner}
                </div>
              )}

              {expandedSong.snapshots && expandedSong.snapshots.length > 0 ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {expandedSong.snapshots.map((img, idx) => (
                    <div
                      key={idx}
                      className="relative rounded-lg overflow-hidden border border-gray-800 bg-black p-1"
                    >
                      <button
                        type="button"
                        onClick={() => removeSnapshot(expandedSong.id, idx)}
                        title="Delete this tab image"
                        className="absolute top-2 right-2 z-10 w-6 h-6 rounded-full bg-black/70 hover:bg-rose-600 text-gray-200 text-xs font-bold border border-gray-600"
                      >
                        ✕
                      </button>
                      <img
                        src={img}
                        alt={`Tab ${idx + 1}`}
                        onError={(e) => {
                          e.currentTarget.src =
                            'https://placehold.co/600x260/18181e/f59e0b?text=Tab+Image';
                        }}
                        className="w-full h-36 object-contain"
                      />
                    </div>
                  ))}
                </div>
              ) : (
                <p className="text-xs text-gray-500 py-2">
                  Launch Songsterr or Ultimate Guitar above, then press Ctrl+V in the box to paste a tab screenshot.
                </p>
              )}
            </section>

            {/* Full-size track player, same row as the tab search bar */}
            {expandedPlayerActive && expandedMedia && (
              <div className="bg-[#18181E] border border-[#2C2C36] rounded-xl p-3 shadow-lg min-w-0">
                {expandedMedia.kind === 'youtube' ? (
                  <div className="aspect-video w-full bg-black rounded-lg overflow-hidden border border-gray-800">
                    <iframe
                      src={expandedMedia.embedUrl}
                      title={expandedSong.title}
                      className="w-full h-full"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                      allowFullScreen
                    />
                  </div>
                ) : expandedMedia.kind === 'audio' ? (
                  <audio src={expandedMedia.audioUrl} controls autoPlay className="w-full" />
                ) : (
                  <a
                    href={expandedMedia.watchUrl}
                    target="_blank"
                    rel="noreferrer"
                    className="text-xs text-amber-400 hover:underline break-all"
                  >
                    Open linked track: {expandedMedia.watchUrl} ↗
                  </a>
                )}
              </div>
            )}
            </div>

            {/* 2. SCALE & BLANK INTERACTIVE CHORD GENERATOR */}
            <section className="bg-[#18181E] border border-[#2C2C36] rounded-xl p-4 shadow-lg space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <h3 className="text-xs font-bold uppercase tracking-wider text-amber-400">
                  2. Scale &amp; Chord Generator
                </h3>
                <div className="flex flex-wrap items-center gap-2 text-xs">
                  <select
                    value={scaleRoot}
                    onChange={(e) => {
                      setScaleRoot(e.target.value);
                      setCustomChordSemitones([]);
                    }}
                    className="bg-[#121216] border border-gray-800 rounded-lg px-2.5 py-1 text-gray-200"
                  >
                    {CHROMATIC_SCALE.map((n) => (
                      <option key={n} value={n}>
                        Key: {n}
                      </option>
                    ))}
                  </select>
                  <select
                    value={selectedScaleName}
                    onChange={(e) => setSelectedScaleName(e.target.value)}
                    className="bg-[#121216] border border-gray-800 rounded-lg px-2.5 py-1 text-gray-200"
                  >
                    {Object.keys(SCALES_MAP).map((sc) => (
                      <option key={sc} value={sc}>
                        Scale: {sc}
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              {/* Populated Scale Fretboard from Song Info */}
              <div className="bg-[#131318] border border-gray-800/90 rounded-lg p-3 space-y-2.5">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <span className="text-xs font-mono text-gray-300">
                    Populated Scale Fretboard (0–24 Frets):{' '}
                    <span className="text-amber-400 font-bold">
                      {scaleRoot} {selectedScaleName}
                    </span>
                  </span>
                  <div className="flex flex-wrap gap-1.5">
                    {activeScaleNotes.map((item) => (
                      <span
                        key={item.offset}
                        className={`px-2 py-0.5 rounded text-[11px] font-mono ${getIntervalToneClass(
                          item.label,
                          true
                        )}`}
                      >
                        {item.note} ({item.label})
                      </span>
                    ))}
                  </div>
                </div>

                {/* Fret Position Numbers & Inlay Markers (0-24) */}
                <div className="overflow-x-auto pb-1">
                  <div className="space-y-1 min-w-[960px]">
                    <div className="flex items-center gap-1 text-[10px] font-mono text-gray-400">
                      <span className="w-4 shrink-0" />
                      <div className="flex-1 grid grid-cols-[repeat(25,minmax(0,1fr))] gap-1 text-center">
                        {FRET_NUMBERS.map((fretNum) => (
                          <div key={fretNum} className="flex flex-col items-center leading-tight">
                            <span>{fretNum}</span>
                            <span className="text-[9px] text-amber-400/80 h-3">
                              {DOUBLE_DOT_FRETS.has(fretNum)
                                ? '••'
                                : SINGLE_DOT_FRETS.has(fretNum)
                                ? '•'
                                : ''}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {GUITAR_STRINGS.map((str, sIdx) => (
                      <div key={sIdx} className="flex items-center gap-1">
                        <span className="w-4 text-[10px] font-mono font-bold text-gray-400 shrink-0">
                          {str.name}
                        </span>
                        <div className="flex-1 grid grid-cols-[repeat(25,minmax(0,1fr))] gap-1">
                          {FRET_NUMBERS.map((fretIdx) => {
                            const { noteName, freq } = getNoteAtFret(sIdx, fretIdx);
                            const noteIdx = CHROMATIC_SCALE.indexOf(noteName);
                            const offsetFromRoot = (noteIdx - scaleRootIdx + 12) % 12;
                            const scaleMatch = activeScaleNotes.find(
                              (sn) => sn.offset === offsetFromRoot
                            );
                            return (
                              <button
                                type="button"
                                key={fretIdx}
                                onClick={() => audioSynthesizer.playGuitarNote(freq)}
                                className={`h-6 rounded text-[10px] font-mono transition-colors truncate px-0.5 ${getIntervalToneClass(
                                  scaleMatch?.label || '',
                                  Boolean(scaleMatch)
                                )}`}
                                title={`Fret ${fretIdx}: ${noteName}${
                                  scaleMatch ? ` (${scaleMatch.label})` : ''
                                }`}
                              >
                                {scaleMatch ? `${noteName}:${scaleMatch.label}` : noteName}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Empty Chord Generator Fretboard Below Scale Fretboard */}
              <div className="bg-[#131318] border border-gray-800/90 rounded-lg p-3 space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="text-xs font-mono text-gray-300">
                    Chord Generator Fretboard (0–24 Frets, Empty by Default):
                  </div>
                  {customChordSemitones.length > 0 && (
                    <button
                      type="button"
                      onClick={() => setCustomChordSemitones([])}
                      className="text-[11px] text-gray-400 hover:text-amber-300 underline shrink-0"
                    >
                      Clear Chord
                    </button>
                  )}
                </div>

                {/* Clickable Interval Selector Row */}
                <div className="flex flex-wrap gap-1.5">
                  {Object.entries(INTERVAL_LABELS).map(([offsetStr, label]) => {
                    const offset = Number(offsetStr);
                    const isSelected = customChordSemitones.includes(offset);
                    const noteName = CHROMATIC_SCALE[(scaleRootIdx + offset) % 12];
                    return (
                      <button
                        type="button"
                        key={offset}
                        onClick={() => toggleCustomChordTone(offset)}
                        className={`px-2 py-1 rounded text-[11px] font-mono transition-colors ${
                          isSelected
                            ? getIntervalToneClass(label, true)
                            : 'bg-[#1B1B23] text-gray-400 border border-gray-800 hover:text-gray-200'
                        }`}
                      >
                        {label} ({noteName})
                      </button>
                    );
                  })}
                </div>

                {/* Dedicated Empty-by-Default 24-Fret Chord Builder Fretboard */}
                <div className="overflow-x-auto pb-1">
                  <div className="space-y-1 min-w-[960px]">
                    <div className="flex items-center gap-1 text-[10px] font-mono text-gray-400">
                      <span className="w-4 shrink-0" />
                      <div className="flex-1 grid grid-cols-[repeat(25,minmax(0,1fr))] gap-1 text-center">
                        {FRET_NUMBERS.map((fretNum) => (
                          <div key={fretNum} className="flex flex-col items-center leading-tight">
                            <span>{fretNum}</span>
                            <span className="text-[9px] text-amber-400/80 h-3">
                              {DOUBLE_DOT_FRETS.has(fretNum)
                                ? '••'
                                : SINGLE_DOT_FRETS.has(fretNum)
                                ? '•'
                                : ''}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {GUITAR_STRINGS.map((str, sIdx) => (
                      <div key={sIdx} className="flex items-center gap-1">
                        <span className="w-4 text-[10px] font-mono font-bold text-gray-400 shrink-0">
                          {str.name}
                        </span>
                        <div className="flex-1 grid grid-cols-[repeat(25,minmax(0,1fr))] gap-1">
                          {FRET_NUMBERS.map((fretIdx) => {
                            const { noteName, freq } = getNoteAtFret(sIdx, fretIdx);
                            const noteIdx = CHROMATIC_SCALE.indexOf(noteName);
                            const offsetFromRoot = (noteIdx - scaleRootIdx + 12) % 12;
                            const isPicked = customChordSemitones.includes(offsetFromRoot);
                            const intervalLabel = INTERVAL_LABELS[offsetFromRoot] || '';
                            return (
                              <button
                                type="button"
                                key={fretIdx}
                                onClick={() => toggleCustomChordTone(offsetFromRoot, freq)}
                                className={`h-6 rounded text-[10px] font-mono transition-colors truncate px-0.5 ${getIntervalToneClass(
                                  intervalLabel,
                                  isPicked
                                )}`}
                                title={`Fret ${fretIdx}: ${noteName}${
                                  isPicked ? ` (${intervalLabel})` : ''
                                }`}
                              >
                                {isPicked ? `${noteName}:${intervalLabel}` : ''}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Interval Names, Interval Types & Possible Alternative Chord Names Outside Key */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                  <div className="bg-[#181820] border border-gray-800 rounded-lg p-2.5">
                    <div className="text-[11px] font-semibold text-amber-400 mb-1.5">
                      Selected Intervals (Name &amp; Type)
                    </div>
                    {pickedChordIntervals.length === 0 ? (
                      <p className="text-[11px] text-gray-500 font-mono">
                        No notes selected yet.
                      </p>
                    ) : (
                      <div className="flex flex-wrap gap-1.5">
                        {pickedChordIntervals.map((iv) => (
                          <span
                            key={iv.offset}
                            className={`px-2 py-1 rounded text-[11px] font-mono ${getIntervalToneClass(
                              iv.intervalName,
                              true
                            )}`}
                          >
                            <strong>{iv.intervalName}</strong> ({iv.note}) —{' '}
                            <span>{iv.intervalType}</span>
                          </span>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="bg-[#181820] border border-gray-800 rounded-lg p-2.5">
                    <div className="text-[11px] font-semibold text-amber-400 mb-1.5">
                      Possible Alternative Chord Names (Outside Key)
                    </div>
                    {alternativeChordNames.length === 0 ? (
                      <p className="text-[11px] text-gray-500 font-mono">
                        Pick 2+ notes to see matching alternative chord names.
                      </p>
                    ) : (
                      <div className="flex flex-wrap gap-1.5">
                        {alternativeChordNames.map((altName) => (
                          <span
                            key={altName}
                            className="px-2 py-1 rounded bg-[#22222C] border border-amber-500/30 text-[11px] font-mono text-amber-200"
                          >
                            {altName}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </section>

            {/* 3. DRUM MACHINE PORTION */}
            <section className="bg-[#18181E] border border-[#2C2C36] rounded-xl p-4 shadow-lg">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-amber-400">
                    3. Drum Machine
                  </h3>
                  <div className="flex items-center gap-1.5">
                    {[0, 1, 2, 3].map((beat) => (
                      <span
                        key={beat}
                        className={`w-2.5 h-2.5 rounded-full ${
                          isPlayingMetronome && currentBeat === beat
                            ? 'bg-amber-400 scale-110'
                            : 'bg-gray-700'
                        }`}
                      />
                    ))}
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-3 text-xs">
                  <span className="font-mono text-amber-300 font-bold">{bpm} BPM</span>
                  <input
                    type="range"
                    min="40"
                    max="220"
                    value={bpm}
                    onChange={(e) => setBpm(Number(e.target.value))}
                    className="w-28 accent-amber-500 cursor-pointer"
                  />
                  <select
                    value={drumPattern}
                    onChange={(e) => setDrumPattern(e.target.value)}
                    className="bg-[#121216] border border-gray-800 rounded-lg px-2.5 py-1 text-gray-200"
                  >
                    <option value="rock">Acoustic Rock Groove</option>
                    <option value="straight">Straight Beat</option>
                    <option value="click">Metronome Click</option>
                  </select>
                  <button
                    type="button"
                    onClick={() => setIsPlayingMetronome((prev) => !prev)}
                    className={`px-3.5 py-1.5 rounded-lg font-bold text-xs ${
                      isPlayingMetronome
                        ? 'bg-rose-500/20 text-rose-400 border border-rose-500/40'
                        : 'bg-amber-500 text-gray-950 hover:bg-amber-400'
                    }`}
                  >
                    {isPlayingMetronome ? 'Stop Drums' : 'Start Drums'}
                  </button>
                </div>
              </div>
            </section>
          </div>
        </div>
      )}

      {/* DUAL TAB SEARCH & SNAPSHOT DRAWER */}
          {drawerSong && (
            <div className="w-full md:w-1/2 max-w-2xl h-full bg-[#16161B] border-l border-amber-500/20 flex flex-col shadow-2xl z-30 transition-all duration-300 shrink-0">
              <div className="h-16 border-b border-[#2A2A32] bg-[#1E1E24] px-4 sm:px-6 flex items-center justify-between gap-2">
                <div className="flex items-center gap-2.5 min-w-0">
                  <span className="text-xs font-semibold uppercase tracking-wider text-amber-400 bg-amber-500/10 px-2 py-1 rounded border border-amber-500/20 shrink-0">
                    {activeTabDrawer.platform}
                  </span>
                  <h2 className="font-bold text-gray-200 text-sm sm:text-base truncate">
                    {drawerSong.artist} - {drawerSong.title}
                  </h2>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <a
                    href={
                      activeTabDrawer.platform === 'songsterr'
                        ? getSongsterrUrl(drawerSong.artist, drawerSong.title)
                        : getUltimateGuitarUrl(drawerSong.artist, drawerSong.title)
                    }
                    target="_blank"
                    rel="noreferrer"
                    className="flex items-center gap-1 text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded border border-gray-700"
                  >
                    Open Direct ↗
                  </a>
                  <button
                    type="button"
                    onClick={() => setActiveTabDrawer(null)}
                    className="text-gray-400 hover:text-gray-100 font-bold text-lg px-2"
                  >
                    ✕
                  </button>
                </div>
              </div>

              <div className="flex-1 flex flex-col overflow-hidden p-4 gap-4">
                <div className="bg-[#1D1D24] p-4 rounded-xl border border-gray-800 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <p className="text-sm text-gray-200 font-medium">
                      Auto-Query Tab Search Ready
                    </p>
                    <p className="text-xs text-gray-400">
                      Launch search query in a new tab or attach screenshot references below.
                    </p>
                  </div>
                  <a
                    href={
                      activeTabDrawer.platform === 'songsterr'
                        ? getSongsterrUrl(drawerSong.artist, drawerSong.title)
                        : getUltimateGuitarUrl(drawerSong.artist, drawerSong.title)
                    }
                    target="_blank"
                    rel="noreferrer"
                    className="bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold text-xs px-4 py-2 rounded-lg transition-colors shadow-lg shadow-amber-500/10"
                  >
                    Launch{' '}
                    {activeTabDrawer.platform === 'songsterr'
                      ? 'Songsterr'
                      : 'Ultimate Guitar'}{' '}
                    ↗
                  </a>
                </div>

                <div className="flex-1 bg-[#1A1A20] rounded-xl border border-[#2D2D36] p-4 flex flex-col overflow-hidden">
                  <h3 className="text-sm font-semibold text-gray-200 mb-3">
                    Tab Screenshots &amp; Custom Reference Notes
                  </h3>

                  <div className="flex gap-2 mb-4">
                    <input
                      type="text"
                      placeholder="Paste Image URL / Screenshot Link..."
                      value={snapshotUrlInput}
                      onChange={(e) => setSnapshotUrlInput(e.target.value)}
                      className="flex-1 bg-[#121215] border border-gray-800 rounded-lg px-3 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-amber-500"
                    />
                    <button
                      type="button"
                      onClick={() => addSnapshotToSong(drawerSong.id)}
                      className="bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs px-3 py-1.5 rounded-lg border border-gray-700 font-medium"
                    >
                      Save Snapshot
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto grid grid-cols-1 gap-3">
                    {drawerSong.snapshots && drawerSong.snapshots.length > 0 ? (
                      drawerSong.snapshots.map((img, idx) => (
                        <div
                          key={idx}
                          className="relative group border border-gray-800 rounded-lg overflow-hidden bg-black"
                        >
                          <button
                            type="button"
                            onClick={() => removeSnapshot(drawerSong.id, idx)}
                            title="Delete this tab image"
                            className="absolute top-2 right-2 z-10 w-6 h-6 rounded-full bg-black/70 hover:bg-rose-600 text-gray-200 text-xs font-bold border border-gray-600"
                          >
                            ✕
                          </button>
                          <img
                            src={img}
                            alt={`Tab Snapshot ${idx + 1}`}
                            onError={(e) => {
                              e.currentTarget.src =
                                'https://placehold.co/600x300/18181e/f59e0b?text=Tab+Snapshot';
                            }}
                            className="w-full h-auto object-contain max-h-[350px]"
                          />
                        </div>
                      ))
                    ) : (
                      <div className="flex flex-col items-center justify-center h-full text-gray-600 text-xs border border-dashed border-gray-800 rounded-lg p-6">
                        No tab screenshots attached to this song yet.
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ADD SONG MODAL */}
          {showAddModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-[#1C1C22] border border-[#2D2D36] rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-5">
                  <h3 className="font-bold text-lg text-gray-100">Add New Song to Board</h3>
                  <button
                    type="button"
                    onClick={() => setShowAddModal(false)}
                    className="text-gray-400 hover:text-gray-200 font-bold"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleAddSong} className="space-y-4">
                  <div>
                    <label className="text-xs text-gray-300 block mb-1 font-medium">
                      Paste Link or &quot;Artist - Title&quot; (Auto-Parses)
                    </label>
                    <input
                      type="text"
                      placeholder="e.g. https://www.youtube.com/watch?v=... or Artist - Song"
                      value={importUrl}
                      onChange={(e) => setImportUrl(e.target.value)}
                      className="w-full bg-[#121215] border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-gray-300 block mb-1 font-medium">
                      Artist Name
                    </label>
                    <input
                      type="text"
                      placeholder="e.g. Pink Floyd"
                      value={manualArtist}
                      onChange={(e) => setManualArtist(e.target.value)}
                      className="w-full bg-[#121215] border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-gray-300 block mb-1 font-medium">
                      Song Title
                    </label>
                    <input
                      type="text"
                      placeholder="e.g. Wish You Were Here"
                      value={manualTitle}
                      onChange={(e) => setManualTitle(e.target.value)}
                      className="w-full bg-[#121215] border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div className="pt-2 flex justify-end gap-3">
                    <button
                      type="button"
                      onClick={() => setShowAddModal(false)}
                      className="px-4 py-2 rounded-lg text-xs font-semibold text-gray-400 hover:text-gray-200 bg-gray-800/40"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-lg text-xs font-bold text-gray-950 bg-amber-500 hover:bg-amber-400 shadow-md shadow-amber-500/10"
                    >
                      Create Song Card
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
